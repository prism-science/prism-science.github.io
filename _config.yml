# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: The DiffUSE Project
email: diffuse@astera.org
description: The DiffUSE Project
twitter_username: username
github_username: prism-science
minimal_mistakes_skin: default
search: true
repository: prism-science/prism-science.github.io
# Pin these explicitly. Setting `repository` activates jekyll-github-metadata,
# which otherwise infers a wrong baseurl (/pages/prism-science) and breaks all links.
url: "https://diffuse.science"
baseurl: ""

# Comments (GitHub Discussions via giscus)
comments:
  provider: "giscus"
  giscus:
    repo_id: "R_kgDOPO07gg"
    category_name: "General"
    category_id: "DIC_kwDOPO07gs4CtV5I"
    discussion_term: "title"
    reactions_enabled: "1"
    emit_metadata: "0"
    input_position: "bottom"
    theme: "light"
    strict: "0"
    lang: "en"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin    : "mint"
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
encoding: utf-8

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/prism-science/"
    - label: "X"
      icon: "fab fa-fw fa-x"
      url: "https://x.com/diffUSEproject"
    - label: "bluesky"
      icon: "fab fa-fw fa-Bluesky"
      url: "https://bsky.app/profile/diffuseproject.bsky.social"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/company/108302469/admin/dashboard/"
    - label: "Instagram"
      icon: "fab fa-fw fa-Instagram"
      url: "https://www.instagram.com/scattering.avengers/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

collections:
  research:

categories:
  type: liquid
  path: /categories/
tag:
  type: liquid
  path: /tags/


analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-QFTC635EK4"
    anonymize_ip: true
